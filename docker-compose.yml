services:
  db:
    image: postgres:15
    container_name: mate_db
    environment:
      POSTGRES_DB: mate_db
      POSTGRES_USER: mate_user
      POSTGRES_PASSWORD: mate_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mate_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: mate_influxdb
    environment:
      INFLUXDB_DB: mate_db
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin123
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mate_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  web:
    build: .
    container_name: mate_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://mate_user:mate_password@db:5432/mate_db
      REDIS_URL: redis://redis:6379
      ODOO_URL: http://odoo:8069
      ODOO_DB: odoo_db
      ODOO_USER: admin
      ODOO_API_KEY: 3f6b4dd01150f1d1e367efcc2615c976840f6e0f
    restart: unless-stopped
  coap:
    build: .
    container_name: mate_coap
    command: python coap_server.py
    volumes:
      - .:/app
    network_mode: host
    restart: unless-stopped

  odoo_db:
    image: postgres:15
    container_name: mate_odoo_db
    environment:
      POSTGRES_DB: odoo_db
      POSTGRES_USER: odoo_user
      POSTGRES_PASSWORD: odoo_password
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  odoo:
    image: odoo:17
    container_name: mate_odoo
    ports:
      - "8069:8069"
    depends_on:
      - odoo_db
    dns:
      - 8.8.8.8
    environment:
      - POSTGRES_HOST=odoo_db
      - POSTGRES_USER=odoo_user
      - POSTGRES_PASSWORD=odoo_password
      - POSTGRES_DB=odoo_db
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo_config:/etc/odoo
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mate_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
  odoo_db_data:
  odoo_data:
